  em{
    font-family:'Leif Trial SN',Georgia,"Times New Roman",serif;
    font-style:italic;
    font-weight:400;
  }
  .wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:64px;
    padding:64px 48px;
    max-width:1280px;
    margin:0 auto;
    flex-wrap:wrap;
  }
  .info{
    flex:1 1 360px;
    max-width:440px;
    background:#fff;
    backdrop-filter:blur(22px) saturate(1.2);
    -webkit-backdrop-filter:blur(22px) saturate(1.2);
    border:1px solid rgba(255,255,255,.6);
    border-radius:28px;
    padding:40px;
    box-shadow:0 20px 60px rgba(32,48,46,.18);
  }
  .brand-line{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
  }
  .brand-line .bar{width:22px;height:3px;background:var(--teal);border-radius:2px;}
  .brand-line span{
    font-size:11px;
    font-weight:700;
    letter-spacing:3px;
    color:var(--teal);
    text-transform:uppercase;
  }
  .info h1{
    font-size:46px;
    font-weight:700;
    line-height:1.12;
    letter-spacing:-.01em;
    margin:0 0 28px;
    color:var(--text-dark);
  }
  .section-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--text-dim);
    text-transform:uppercase;
    margin:0 0 12px;
  }
  .flow-tabs{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,.75);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:5px;
    margin-bottom:36px;
    flex-wrap:wrap;
    box-shadow:0 1px 3px rgba(32,48,46,.06);
  }
  .flow-tab{
    flex:1 1 auto;
    text-align:center;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s,color .15s;
    position:relative;
  }
  .flow-tab.active{background:var(--blue-bright);color:#fff;}
  .flow-tab.disabled{cursor:not-allowed;opacity:.7;}
  .flow-tab .soon{
    display:block;
    font-size:9px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:#C98A2E;
    margin-top:2px;
  }
  .flow-tab.active .soon{color:rgba(255,255,255,.85);}
  /* leverage more of the brand palette across the disabled flow tabs */
  .flow-tab:nth-child(2) .soon{color:#B9758C;}
  .flow-tab:nth-child(3) .soon{color:#6E8A57;}
  .flow-tab:nth-child(4) .soon{color:#6D66B0;}

  .scenario-label{margin-top:8px;}
  .scenario-list{display:flex;flex-direction:column;gap:10px;}
  .scenario-item{
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(255,255,255,.75);
    border:1px solid var(--panel-line);
    border-radius:12px;
    padding:14px 16px;
    cursor:pointer;
    transition:border-color .15s,background .15s;
    box-shadow:0 1px 3px rgba(32,48,46,.06);
  }
  .scenario-item.active{
    border-color:var(--blue-bright);
    background:linear-gradient(90deg, rgba(57,149,252,.10), rgba(57,149,252,.02));
  }
  .scenario-num{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--peach);
    color:var(--teal);
    font-size:12px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  /* leverage more of the brand palette across the scenario badges */
  .scenario-item:nth-child(2) .scenario-num{background:#CCCAE8;color:#4165CA;}
  .scenario-item.active .scenario-num{background:var(--blue-bright);color:#fff;}
  .scenario-item .meta{display:flex;flex-direction:column;gap:2px;}
  .scenario-item .tag{
    font-size:10px;
    font-weight:700;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .scenario-item:nth-child(2) .tag{color:#6D66B0;}
  .scenario-item.active .tag{color:var(--blue-bright);}
  .scenario-item .desc{font-size:14px;font-weight:600;color:var(--text-dark);}

  .stage{
    flex:0 0 auto;
    position:relative;
    width:358px;
    height:776px;
    overflow:hidden;
  }
  iframe{
    position:absolute;
    top:0;
    left:0;
    width:421px;
    height:912px;
    border:none;
    background:transparent;
    display:block;
    transform:scale(0.85);
    transform-origin:top left;
  }

  @media (max-width:900px){
    .wrap{gap:32px;padding:40px 20px;}
    .info{max-width:100%;text-align:left;}
    iframe{width:100%;max-width:393px;height:912px;}
  }

  @media (hover:hover){
    .flow-tab:not(.disabled):not(.active):hover{background:rgba(57,149,252,.10);color:var(--teal);}
    .flow-tab.active:hover{background:#2782e6;}

<div class="wrap">
  <div class="info">
    <div class="brand-line"><span class="bar"></span><span>OVME Medical Aesthetics</span></div>
    <h1>Web App<br><em>demo</em></h1>

    <div class="section-label">Flow</div>
    <div class="flow-tabs">
      <div class="flow-tab active" data-flow="home" onclick="setFlow(this,'home')">Home</div>
      <div class="flow-tab" data-flow="book" onclick="setFlow(this,'book')">Book appointment</div>
      <div class="flow-tab" data-flow="profile" onclick="setFlow(this,'profile')">Profile</div>
      <div class="flow-tab" data-flow="beauty" onclick="setFlow(this,'beauty')">Beauty journey</div>
    </div>

    <div class="section-label scenario-label" id="scenarioLabel">Start on</div>
    <div class="scenario-list" id="scenarioList">
      <div class="scenario-item active" data-start="home-appointment" onclick="setStart(this,'home-appointment')">
        <div class="scenario-num">1</div>
        <div class="meta">
          <span class="desc">Appointment booked</span>
        </div>
      </div>
      <div class="scenario-item" data-start="home-nudge" onclick="setStart(this,'home-nudge')">
        <div class="scenario-num">2</div>
        <div class="meta">
          <span class="desc">Nudge to book</span>
        </div>
      </div>
    </div>
  </div>

  <div class="stage">
    <iframe id="proto" src="ovme_prototype.html?start=home-appointment" title="OVME book appointment prototype"></iframe>
  </div>
</div>

<script>
function comingSoon(){
  // other flows will be wired up here as they're built
}
function setStart(el, screenId){
  document.querySelectorAll('.scenario-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  const frame = document.getElementById('proto');
  frame.src = 'ovme_prototype.html?start=' + screenId;
}

const SCENARIOS = {
  book: [
    {start:'locations', num:1, desc:'Locations near you'},
    {start:'service', num:2, desc:'Select a service'}
  ],
  beauty: [
    {start:'beauty-tray', num:1, desc:'Journey timeline'},
    {start:'guided-capture', num:2, desc:'Guided capture'}
  ],
  profile: [
    {start:'profile', num:1, desc:'Profile'},
    {start:'beauty-tray', num:2, desc:'Beauty journey'},
    {start:'messages', num:3, desc:'Messages'}
  ],
  home: [
    {start:'home-appointment', num:1, desc:'Appointment booked'},
    {start:'home-nudge', num:2, desc:'Nudge to book'}
  ]
};

function renderScenarios(flow){
  const list = SCENARIOS[flow] || [];
  const scenarioList = document.getElementById('scenarioList');
  if(!scenarioList) return;
  scenarioList.innerHTML = list.map((s,i) => `
    <div class="scenario-item${i===0?' active':''}" data-start="${s.start}" onclick="setStart(this,'${s.start}')">
      <div class="scenario-num">${s.num}</div>
      <div class="meta">
        <span class="desc">${s.desc}</span>
      </div>
    </div>
  `).join('');
}

function setFlow(el, flow){
  document.querySelectorAll('.flow-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const frame = document.getElementById('proto');
  const scenarioLabel = document.getElementById('scenarioLabel');
  const scenarioList = document.getElementById('scenarioList');
  if(SCENARIOS[flow]){
    if(scenarioLabel) scenarioLabel.style.display = '';
    if(scenarioList) scenarioList.style.display = '';
    renderScenarios(flow);
    const first = SCENARIOS[flow][0];
    frame.src = 'ovme_prototype.html?start=' + first.start;
  }
}
</script>
